<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSTunnel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0d14] text-gray-200 font-sans antialiased h-screen flex flex-col select-none overflow-hidden">

  <!-- Barra Superior -->
  <header class="h-10 bg-gray-950 border-b border-gray-800 flex items-center justify-between px-4 drag" style="padding-right: 0px !important;">
    <div class="flex items-center gap-2 text-xs font-semibold text-gray-400">
      
      <div class="icone" style="width: 25px; height: 25px;">
        <img src="icon.ico" width="100%">
      </div>
      JSTunnel
    </div>
    <div class="flex items-center no-drag">
      <button id="btn-minimize" class="h-10 px-3 hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">─</button>
      <button id="btn-close" class="h-10 px-3 hover:bg-red-600 text-gray-400 hover:text-white transition-colors">✕</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-white">Projetos & Túneis</h1>
          <p class="text-xs text-gray-400 mt-0.5">Processos isolados por subdomínio</p>
        </div>

        <div class="flex items-center gap-2">
          <div id="auth-status-badge" class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg text-xs">
            <span id="auth-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
            <span id="auth-text" class="text-gray-400 font-medium">Verificando...</span>
          </div>

          <button id="btn-login" class="bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold px-3 py-2 rounded-lg border border-gray-700">Login</button>
          <button id="btn-logout" class="hidden bg-red-950/40 hover:bg-red-900/60 text-xs text-red-400 font-semibold px-3 py-2 rounded-lg border border-red-800/50">Logout</button>
          <button id="btn-refresh" class="bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold px-3 py-2 rounded-lg border border-gray-700">🔄</button>
          <button id="btn-open-create" class="bg-orange-600 hover:bg-orange-500 text-xs text-white font-bold px-4 py-2 rounded-lg shadow-lg shadow-orange-900/20">+ Novo Túnel</button>
        </div>
      </div>

      <div id="tunnels-container" class="space-y-6">
        <div class="text-xs text-gray-500">Carregando túneis...</div>
      </div>
    </main>

    <!-- Sidebar Logs -->
    <aside class="w-80 bg-gray-950 border-l border-gray-800 flex flex-col">
      <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-gray-900/50">
        <span class="text-xs font-bold text-gray-400">LOGS DO SISTEMA</span>
        <span id="active-log-target" class="text-[10px] text-orange-400 font-mono"></span>
      </div>
      <div id="terminal-logs" class="flex-1 p-3 font-mono text-[11px] text-emerald-400/90 overflow-y-auto space-y-1 leading-relaxed bg-black/40">
        <div class="text-gray-600 italic">[Pronto para iniciar processos...]</div>
      </div>
    </aside>
  </div>

  <!-- Modal Criar Túnel -->
  <div id="modal-create" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-96 space-y-4 shadow-2xl">
      <h3 class="text-base font-bold text-white">Criar Novo Túnel</h3>
      <div id="create-error" class="hidden text-xs text-red-400 bg-red-950/50 border border-red-800/50 p-2.5 rounded-lg"></div>

      <div>
        <label class="text-xs text-gray-400 block mb-1">Domínio Cloudflare</label>
        <input id="create-domain" type="text" placeholder="meusite.com" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-orange-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1">Subdomínio (Nome do Projeto)</label>
        <input id="create-name" type="text" placeholder="dev1" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-orange-500">
      </div>
      <div class="flex gap-2">
        <div class="w-2/3">
          <label class="text-xs text-gray-400 block mb-1">Porta Local</label>
          <input id="create-port" type="number" value="3000" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-orange-500">
        </div>
        <div class="w-1/3">
          <label class="text-xs text-gray-400 block mb-1">Protocolo</label>
          <select id="create-proto" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-orange-500">
            <option value="http">http</option>
            <option value="https">https</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-cancel-create" class="px-3 py-1.5 text-xs text-gray-400 hover:text-white">Cancelar</button>
        <button id="btn-submit-create" class="bg-orange-600 hover:bg-orange-500 text-xs text-white px-4 py-1.5 rounded-lg font-bold">
          <span id="create-btn-text">Criar</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Editar Túnel -->
  <div id="modal-edit" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-96 space-y-4 shadow-2xl">
      <h3 class="text-base font-bold text-white">Editar Projeto</h3>
      <div id="edit-error" class="hidden text-xs text-red-400 bg-red-950/50 border border-red-800/50 p-2.5 rounded-lg"></div>

      <input id="edit-domain" type="hidden">
      <input id="edit-name" type="hidden">

      <div>
        <label class="text-xs text-gray-500 block mb-1">URL Pública</label>
        <div id="edit-host-display" class="text-xs text-orange-400 font-mono bg-black/40 p-2 rounded-lg border border-gray-800"></div>
      </div>

      <div class="flex gap-2">
        <div class="w-2/3">
          <label class="text-xs text-gray-400 block mb-1">Porta Local</label>
          <input id="edit-port" type="number" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-orange-500">
        </div>
        <div class="w-1/3">
          <label class="text-xs text-gray-400 block mb-1">Protocolo</label>
          <select id="edit-proto" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-orange-500">
            <option value="http">http</option>
            <option value="https">https</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-cancel-edit" class="px-3 py-1.5 text-xs text-gray-400 hover:text-white">Cancelar</button>
        <button id="btn-submit-edit" class="bg-orange-600 hover:bg-orange-500 text-xs text-white px-4 py-1.5 rounded-lg font-bold">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <style>
    .drag { -webkit-app-region: drag; }
    .no-drag { -webkit-app-region: no-drag; }
  </style>

  <script src="app.js"></script>
</body>
</html>
